name: test

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install test dependencies
        run: npm ci --ignore-scripts

      - name: Run tests
        run: npm test

      - name: Check version consistency
        run: ./scripts/bump-version.sh --audit

      # The audit only proves the manifests agree with each other. If every
      # manifest is stale together, it still passes. On tag runs, pin the
      # release to the tag so a stale-but-consistent version cannot ship.
      - name: Verify tag matches manifest version
        if: github.ref_type == 'tag'
        run: ./scripts/bump-version.sh --check "${GITHUB_REF_NAME#v}"
